<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recomendación Nº 21 Régimen Penal Juvenil</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F4FF;--ink:#17173F;--mut:#58587F;--card:#fff;--ln:#D9D7F1;--a:#4F46E5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0E24;--ink:#EEEEFF;--mut:#A9A9D0;--card:#191938;--ln:#2E2E5C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0E24;--ink:#EEEEFF;--mut:#A9A9D0;--card:#191938;--ln:#2E2E5C;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Figtree,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:"Bricolage Grotesque",Georgia,serif;line-height:1.08;margin:0}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);gap:30px;max-width:1100px;margin:0 auto;padding:16px}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;display:flex;flex-direction:column;gap:4px}
nav b{font:800 18px "Bricolage Grotesque",serif;padding:0 12px 10px}
nav button{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid transparent;border-radius:14px;padding:9px 12px;background:none;color:var(--ink);font:600 15px Figtree,sans-serif;cursor:pointer}
nav button:hover{background:var(--card)}
nav button[aria-current=true]{background:var(--card);border-color:var(--a)}
button:focus-visible{outline:3px solid var(--a);outline-offset:2px}
main:focus{outline:none}
.hero h1{font-size:clamp(34px,6vw,60px);font-weight:800;max-width:15ch}
.sub{color:var(--mut);margin:14px 0 22px;max-width:60ch}
.card{background:var(--card);border:2px solid var(--ln);border-radius:20px;padding:18px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:20px 0}
.g .card{border-top:7px solid var(--a)}
.g .card:nth-child(even){border-radius:8px 28px 8px 28px}
.g h3{font-size:19px;margin-bottom:6px}
.g p{margin:0;font-size:16px;color:var(--mut)}
.em{font-size:38px}
main header{display:flex;gap:14px;align-items:center;margin-bottom:18px}
main h2{font-size:clamp(28px,4.5vw,42px);font-weight:800}
.one{background:color-mix(in srgb,var(--a) 15%,var(--card));border-left:8px solid var(--a);border-radius:6px 24px 24px 6px;padding:16px 22px;font-size:19px;font-weight:600;margin:0 0 20px}
.ask{border:2px dashed var(--a);border-radius:24px;padding:16px 22px}
.ask h3{font-size:20px;margin-bottom:4px}.ask p{margin:0}
.pg{color:var(--mut);font-size:14px;margin:14px 0}
.btn{border:2px solid var(--a);background:var(--a);color:#fff;border-radius:99px;padding:9px 18px;font:700 15px Figtree,sans-serif;cursor:pointer}
.btn.o{background:none;color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.ar{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;margin:8px 0}
.tk{position:relative;height:34px;background:var(--ln);border-radius:12px;overflow:hidden}
.f{position:absolute;top:0;bottom:0;border-radius:10px;transform:scaleX(0);transform-origin:left;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.on .f{transform:scaleX(1)}
.tl{display:flex;justify-content:space-between;margin:4px 0 0 74px;font-size:13px;color:var(--mut)}
.br{display:grid;grid-template-columns:128px 1fr 62px;gap:10px;align-items:center;margin:9px 0;font-size:15px}
.bt{position:relative;height:22px;background:var(--ln);border-radius:8px}
.bt::after{content:"";position:absolute;left:66.67%;top:-4px;bottom:-4px;border-left:2px dashed var(--ink);opacity:.5}
.bt i{display:block;height:100%;width:0;border-radius:8px;background:#4F46E5;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bt i.hl{background:#FF6B57}
.on .bt i{width:var(--w)}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 20px}
.st div{background:var(--card);border:2px solid var(--ln);border-radius:18px;padding:14px}
.st b{display:block;font:800 36px "Bricolage Grotesque",serif;color:var(--a)}
.st span{font-size:14px;color:var(--mut)}
ul.ch{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:0 0 20px}
.ch li{background:var(--card);border:2px solid var(--ln);border-radius:16px;padding:12px 14px;font-size:15px}
.ch li::before{content:"✔ ";color:var(--a)}
.pr{height:14px;background:var(--ln);border-radius:9px;overflow:hidden}
.pr i{display:block;height:100%;width:0;background:#12B5A0;transition:width .5s}
details.card{margin:10px 0}
details.ok{border-color:#12B5A0}
summary{cursor:pointer;font:700 18px "Bricolage Grotesque",serif}
details ul{color:var(--mut);padding-left:20px;margin:12px 0}
dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
dl div{background:var(--card);border:2px solid var(--ln);border-radius:16px;padding:14px}
dt{font:800 19px "Bricolage Grotesque",serif;color:var(--a)}dd{margin:4px 0 0;color:var(--mut);font-size:15px}
footer{color:var(--mut);font-size:13px;margin:30px 0 10px}
@media(max-width:860px){.app{grid-template-columns:minmax(0,1fr);gap:10px}
nav{flex-direction:row;overflow-x:auto;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:8px 0}
nav b{display:none}nav button{white-space:nowrap}.br{grid-template-columns:96px 1fr 54px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head>
<body><div class="app"><nav id="nav" aria-label="Secciones"><b>Recomendación Nº 21</b></nav><main id="main" tabindex="-1"></main></div>
<script>
const C=["#4F46E5","#FF6B57","#12B5A0","#D99A00"];
const S=[
{id:"ctx",e:"🧭",n:"El contexto",h:"Una ley nueva y un país que quizás no está listo",m:"La ley suma muchos adolescentes al sistema y faltan lugares, personal, dinero y coordinación.",
one:"La Defensoría no discute solo la ley: advierte que faltan condiciones materiales y políticas para aplicarla sin violar derechos de chicas y chicos.",
p:"La Defensoría ya había dicho que la ley 27.801 choca con la Constitución y con la Convención sobre los Derechos del Niño (CDN). Lamenta que el Congreso la aprobara sin escuchar sus recomendaciones, las órdenes de la Corte Interamericana ni las observaciones de la ONU. Por eso este documento se centra en lo que viene: la aplicación.",
pts:[["Más chicos en el sistema","Al bajar la edad desde la que se puede castigar, muchos más adolescentes pasarán por juzgados, defensorías, policías y centros de encierro."],
["Ya había problemas","Con la ley anterior (decreto-ley 22.278), algunas provincias ya tenían centros superpoblados o en malas condiciones, comprobado por jueces y organismos de control."],
["Falta un plan común","A una semana de empezar a regir no había una estrategia federal coordinada. Las provincias deben construir, contratar y sancionar leyes propias."],
["¿Y la plata?","No se sabe cómo se usará la partida del artículo 51 ni qué provincias la recibirán. El gasto debería priorizar a las regiones y a los chicos más vulnerables."],
["Reglas desparejas","Solo Buenos Aires tiene ley de ejecución de penas para menores. Un adolescente recibirá un trato distinto según la provincia donde le toque cumplir la condena."]],
ask:"Que la ley empiece a regir con un programa federal de implementación que respete los estándares de la justicia penal juvenil.",pg:"págs. 1–3"},
{id:"esp",e:"🧒",n:"Especialidad",h:"Un sistema pensado para chicos, no para adultos",m:"Leyes, centros y personal propios, desde la detención hasta el fin de la pena.",
one:"“Especialidad” significa que los adolescentes necesitan leyes, instituciones, personal y procedimientos propios, porque están en pleno desarrollo emocional, intelectual y moral.",
pts:[["Tres frentes","Jueces: juzgados de ejecución penal juvenil. Legisladores: leyes de ejecución especiales. Administración: centros y programas separados por edades, sin aislamiento en celda."],
["Dependen de niñez","Los centros deben depender de las áreas de niñez, no de seguridad, policía o servicio penitenciario. La meta es reintegrar, no castigar."],
["Nunca con adultos","La separación debe ser “total y estructural”. Un módulo aparte dentro de una cárcel de adultos no alcanza: sigue siendo riesgoso (violencia, personal sin formación, cultura de castigo)."],
["Después de los 18, sigue","Cumplir 18 años no corta el abordaje especializado. El artículo 30 de la ley lo vulnera; se pide mantenerlo y aplicar las leyes provinciales que ya lo prevén (Buenos Aires, Chubut, Jujuy, CABA, entre otras)."]],
ask:"Mantener los centros bajo niñez, no alojar adolescentes con adultos y reconocer la continuidad especializada tras la mayoría de edad.",pg:"págs. 3–6"},
{id:"ult",e:"🔑",n:"Último recurso",h:"Encierro: solo como último recurso",m:"Privar de libertad debe ser excepcional; la ley lo acerca a ser la regla.",v:"bars",
one:"La Convención pide que el encierro sea el último recurso y que, si se puede, se evite el juicio. Según la Defensoría, los artículos 11, 41, 42 y 43 hacen lo contrario.",
pts:[["Alternativas más difíciles","Las medidas alternativas exigen condiciones más duras y discrecionales que las de los adultos."],
["Qué deben hacer los jueces","Aplicar la ley respetando la Constitución: encierro excepcional, medidas fuera del juicio y “mínima intervención”: castigar solo lo más grave y cuando nada menos duro funcionó."],
["Penas largas, penas dudosas","Para la Defensoría, más de 10 años ya es pena “elevada”: el tiempo pesa más en la adolescencia, la región pone topes cercanos a 10 y la ley anterior permitía reducir la pena."]],
ask:"Aplicar el encierro de forma excepcional y priorizar medidas no judiciales y alternativas.",pg:"págs. 6–7 y nota 40"},
{id:"pro",e:"🩺",n:"Protección y salud",h:"Los jueces penales no deben hacer de protectores ni de médicos",m:"Proteger derechos y atender salud mental no es tarea de jueces penales.",
one:"La ley da a jueces y fiscales funciones que, según las leyes 26.061 (protección de la niñez) y 26.657 (salud mental), corresponden a organismos administrativos y de salud.",
pts:[["Protección bajo mando penal","Los artículos 5 (m) y 9 permiten al juez penal dictar “medidas protectorias” y dejan a los organismos de protección como simples auxiliares."],
["Consumo de drogas o alcohol","Los artículos 35 y 36 dejan en manos de jueces y fiscales a quienes tengan “uso problemático”. La ley de salud mental prioriza equipos de salud y tratamientos ambulatorios y comunitarios."],
["Choque con las provincias","Santiago del Estero, Jujuy y CABA ya impiden que el fuero penal intervenga en protección integral. La Corte Suprema dijo que esas medidas son de los organismos de protección y su control, de la justicia civil."],
["Riesgo para el propio juez","Al asumir tareas ajenas, el juez penal pierde su rol de garante imparcial del debido proceso."]],
ask:"Respetar sin excepciones las leyes 26.061 y 26.657.",pg:"págs. 7–8"},
{id:"com",e:"🚓",n:"Comisarías y CAD",h:"Chicos detenidos: nunca en comisarías",m:"Hay que crear Centros de Admisión y Derivación (CAD) para no usar comisarías.",v:"chips",
one:"Argentina ya fue condenada por detenciones policiales ilegales de adolescentes (caso Bulacio). La Corte Suprema llamó “intolerable” a la detención en comisarías y la ONU pidió terminarla.",
p:"Los CAD son lugares y equipos especializados que reciben al adolescente aprehendido, lo evalúan y lo derivan o liberan rápido. Se acordaron en el Consejo Federal de Niñez (COFENAF) en 2021. Estos son sus siete estándares mínimos:",
L:["Única puerta de entrada: jamás comisarías ni alcaidías","Convenios entre policía, protección de la niñez, salud y justicia","Personal de salud propio, sin depender del “precario médico” policial","Equipos interdisciplinarios que involucren a la familia","Ubicación accesible, donde más aprehensiones hay","Abiertos las 24 horas, los 365 días","Proyecto institucional propio"],
ask:"Prohibir las aprehensiones en comisarías y alojar solo en CAD, con protocolos entre el área de niñez y las de seguridad.",pg:"págs. 8–9"},
{id:"con",e:"🏠",n:"Condiciones de encierro",h:"Cómo deben vivir los chicos que están detenidos",m:"Hoy hay centros grandes, hacinados, con poca educación y contacto familiar.",v:"stats",
one:"La Defensoría vio centros con más de 30 chicos, cuartos de más de 4 camas, baños rotos, poco personal, educación recortada y visitas de apenas 20 o 30 minutos semanales. Teme que empeore.",
pts:[["Reglas y protocolos","Cada centro necesita proyecto institucional y protocolos escritos y públicos (ingresos, emergencias, abuso sexual, medicación, quejas). Requisas sin tocar; fuerza solo excepcional; sanciones con defensa y recurso, sin aislamiento ni privar de comida o visitas."],
["Personal","Especializado, suficiente, bien contratado y capacitado. Sin policías ni penitenciarios cuidando, y sin armas letales frente a los chicos."],
["Derechos que siguen","Salud permanente (con examen médico al ingresar), comida elaborada por nutricionistas, educación certificada, participación, familia en sentido amplio, juego, intimidad, educación sexual y trato digno."],
["Lejos de casa, no","Los traslados a provincias remotas dañan el vínculo con familia y abogados, y no pueden quedar solo en convenios entre gobiernos: debe decidir un juez."],
["Edificios seguros","Cerca de las familias, lejos de riesgos ambientales, con espacio de salud, agua caliente, habilitaciones, alarmas, salidas y planes de evacuación."]],
ask:"Cumplir los estándares de ubicación, capacidad, dormitorios, higiene, seguridad y privacidad.",pg:"págs. 9–18"},
{id:"pla",e:"📝",n:"Plan individual",h:"Un plan a medida para cada chico",m:"Cada adolescente necesita plan individual, revisiones frecuentes y libertad anticipada si corresponde.",
one:"El plan individual de ejecución de la pena se arma con el adolescente y el organismo de niñez; lo controla un juez especializado, nunca uno de adultos.",
pts:[["Qué incluye","Objetivos educativos y de reparación, plazo, recursos asignados, etapas y condiciones para su desarrollo hasta el final."],
["Revisiones y traslados","El encierro se revisa en plazos breves. Si lo trasladan, se reconocen sus avances, sigue su plan, sin esposas ni móviles policiales de adultos, y su legajo viaja antes."],
["Tope de 15 años","Puede dejar presos a jóvenes de 25. Por eso los jueces deben priorizar libertades anticipadas, arrestos domiciliarios o morigeraciones."],
["Libertad condicional más dura","El artículo 19 exige más a adolescentes que a adultos. Los jueces deben controlar de oficio si es constitucional."],
["Sin ley de adultos","Las normas de ejecución penal de adultos no se aplican por analogía."]],
ask:"Que todos los adolescentes que cumplan penas tengan plan individual de ejecución.",pg:"págs. 18–20"}];
const V=[{id:"inicio",e:"✨",n:"Inicio"},...S,{id:"rec",e:"✅",n:"Qué se recomienda"},{id:"glo",e:"📖",n:"Palabras difíciles"}];
const R=[["Cumplir el principio de especialidad, de la detención al fin de la pena",["Centros bajo las áreas de niñez","Prohibido alojar con adultos","Continuidad del tratamiento especializado tras los 18"]],
["Cumplir la excepcionalidad de la judicialización y del encierro",["Encierro como último recurso","Medidas no judiciales y alternativas a la pena"]],
["No adoptar medidas de protección ni de salud mental desde jueces penales",["Respetar las leyes 26.061 y 26.657"]],
["Prohibir aprehensiones en comisarías",["Protocolos entre niñez y seguridad","Alojamiento exclusivo en CAD"]],
["Garantizar derechos y resocialización en centros cerrados",["Proyecto institucional y protocolos públicos","Requisas respetuosas (con tecnología) y uso de la fuerza excepcional","Reglas de convivencia con debido proceso","Personal capacitado, sin fuerzas de seguridad","Examen médico al ingreso y salud continua, con abordaje de drogas","Comida adecuada y educación afuera, certificada (20 h primaria, 25 h secundaria) y talleres","Participación, familia, vida privada, autonomía sexual e identidad de género","Sin traslados a lugares remotos","Nada de trato cruel: aislamiento, castigos colectivos, privar de comida, clases o visitas","Ubicación e infraestructura adecuadas"]],
["Garantizar un plan de ejecución individual de la pena",["Para toda modalidad de pena, elaborado con el adolescente"]]];
const B=[["Argentina (ley 27.801)",15,1],["Chile",10],["Uruguay",10],["Alemania",10],["Venezuela",8],["España",8],["Bolivia",6],["Canadá",3],["Reino Unido",2]];
const T=[["20","plazas como máximo por centro"],["6 m²","por persona en el dormitorio"],["4","chicos por cuarto como tope"],["1 cada 4","un baño y un cuidador cada 4 chicos"],["20 h / 25 h","de clase semanal: primaria / secundaria"],["24 / 7","los CAD funcionan sin pausa"]];
const G=[["CDN","Convención sobre los Derechos del Niño: tratado internacional con jerarquía constitucional."],["Especialidad","Justicia, centros y personal propios para adolescentes."],["Último recurso","El encierro solo cuando nada menos duro sirve, y por el menor tiempo posible."],["Mínima intervención","Castigar solo lo más grave y cuando fallaron otras vías menos duras."],["CAD","Centros de Admisión y Derivación: reciben al adolescente aprehendido en vez de la comisaría."],["Corpus iuris","El conjunto de normas internacionales sobre derechos de la infancia."],["Pro persona","Ante dos normas, se aplica la que más protege a la persona."],["Control de constitucionalidad","Que el juez revise si una norma respeta la Constitución, incluso sin que se lo pidan."],["Morigeración","Cumplir la medida de forma más leve, por ejemplo en el domicilio."]];
const $=s=>document.querySelector(s),nav=$("#nav"),main=$("#main");let cur=-1,done=new Set;
V.forEach((v,i)=>{const b=document.createElement("button");b.innerHTML="<span>"+v.e+"</span>"+v.n;b.onclick=()=>go(i);nav.append(b)});
const ages=[["Antes",16,"#4F46E5"],["Ahora",14,"#FF6B57"]];
function home(){return`<section class="hero"><h1>Régimen Penal Juvenil</h1>
<p class="sub">Resumen en lenguaje sencillo de la Recomendación Nº 21 de la Defensoría de los Derechos de las Niñas, Niños y Adolescentes (septiembre de 2026, 33 páginas) sobre la ley 27.801.</p>
<div class="card"><h3>¿Desde qué edad se puede juzgar penalmente?</h3>${ages.map((a,k)=>`<div class="ar"><b>${a[0]}</b><div class="tk"><i class="f" style="left:${(a[1]-12)*12.5}%;width:${(18-a[1])*12.5}%;background:${a[2]};transition-delay:${k*.45}s"></i></div></div>`).join("")}<div class="tl"><span>12</span><span>14</span><span>16</span><span>18</span><span>20</span></div>
<p class="pg">Según las notas 3 y 4 del documento, la edad mínima bajó de 16 a 14 años.</p></div></section>
<h2 style="margin-top:30px">En un minuto</h2><div class="g">${S.map((s,i)=>`<div class="card" style="--a:${C[(i+1)%4]}"><h3>${s.e} ${s.n}</h3><p>${s.m}</p><div class="row"><button class="btn o" onclick="go(${i+1})">Ver más</button></div></div>`).join("")}</div>`}
function vis(s){if(s.v=="bars")return`<div class="card" style="margin-bottom:20px"><h3>Pena máxima para adolescentes, en años</h3><div style="margin-top:10px">${B.map(b=>`<div class="br"><span>${b[0]}</span><div class="bt"><i${b[2]?' class="hl"':""} style="--w:${b[1]/15*100}%"></i></div><b>${b[1]} años</b></div>`).join("")}</div><p class="pg">La línea punteada marca 10 años, desde donde la Defensoría considera “elevada” una pena. Máximos citados en la nota 40 del documento; el tope de Argentina es el de la ley 27.801 (pág. 19).</p></div>`;
if(s.v=="stats")return`<div class="st">${T.map(t=>`<div><b>${t[0]}</b><span>${t[1]}</span></div>`).join("")}</div><p class="pg" style="margin-top:-8px">Estándares mínimos que la Defensoría pide para los centros.</p>`;
if(s.v=="chips")return`<p>${s.p}</p><ul class="ch">${s.L.map(l=>`<li>${l}</li>`).join("")}</ul>`;return""}
function sec(i){const s=V[i];return`<header><span class="em">${s.e}</span><h2>${s.h}</h2></header><p class="one">${s.one}</p>${s.p&&s.v!="chips"?`<p>${s.p}</p>`:""}${vis(s)}<div class="g">${s.pts?s.pts.map(p=>`<div class="card"><h3>${p[0]}</h3><p>${p[1]}</p></div>`).join(""):""}</div><div class="ask"><h3>Qué pide la Defensoría</h3><p>${s.ask}</p></div><p class="pg">Dónde está en el PDF: ${s.pg}</p>${nx(i)}`}
function nx(i){return`<div class="row">${i>0?`<button class="btn o" onclick="go(${i-1})">Anterior</button>`:""}${i<V.length-1?`<button class="btn" onclick="go(${i+1})">Siguiente: ${V[i+1].n}</button>`:""}</div>`}
function recs(){return`<header><span class="em">✅</span><h2>Qué recomienda la Defensoría</h2></header><p class="one">Seis pedidos a los poderes públicos de la Nación y las provincias. Abrilos y marcá los que ya repasaste.</p><div class="pr"><i id="pb"></i></div><p id="pt" class="pg"></p>${R.map((r,k)=>`<details class="card${done.has(k)?" ok":""}"><summary>${r[0]}</summary><ul>${r[1].map(x=>`<li>${x}</li>`).join("")}</ul><button class="btn o" data-r="${k}">${done.has(k)?"Repasado":"Marcar como repasado"}</button></details>`).join("")}<p class="pg">Dónde está en el PDF: págs. 20–23</p>${nx(i=V.findIndex(v=>v.id=="rec"))}`}
function glos(){return`<header><span class="em">📖</span><h2>Palabras difíciles</h2></header><dl>${G.map(g=>`<div><dt>${g[0]}</dt><dd>${g[1]}</dd></div>`).join("")}</dl>${nx(V.length-1)}`}
function prog(){const p=$("#pb");if(p){p.style.width=done.size/R.length*100+"%";$("#pt").textContent="Repasaste "+done.size+" de "+R.length}}
function go(i){if(i==cur)return;cur=i;const v=V[i];document.documentElement.style.setProperty("--a",C[i%4]);[...nav.querySelectorAll("button")].forEach((b,k)=>b.setAttribute("aria-current",k==i));
main.classList.remove("on");main.innerHTML=v.id=="inicio"?home():v.id=="rec"?recs():v.id=="glo"?glos():sec(i);prog();
try{location.hash=v.id}catch(e){}window.scrollTo(0,0);requestAnimationFrame(()=>requestAnimationFrame(()=>main.classList.add("on")))}
main.addEventListener("click",e=>{const b=e.target.closest("[data-r]");if(!b)return;const k=+b.dataset.r,d=b.closest("details");done.has(k)?done.delete(k):done.add(k);d.classList.toggle("ok",done.has(k));b.textContent=done.has(k)?"Repasado":"Marcar como repasado";prog()});
function fromHash(){const i=V.findIndex(v=>v.id==location.hash.slice(1));go(i<0?0:i)}
addEventListener("hashchange",fromHash);fromHash();
</script>
