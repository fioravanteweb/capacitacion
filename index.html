<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capacitación Jurídica · Defensoría Oficial</title>
<meta name="theme-color" content="#4F46E5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens ---------- */
:root{
  color-scheme:light;
  --bg:#F4F5FB;
  --surf:#FFFFFF;
  --ink:#0F172A;
  --mut:#5B6785;
  --line:#E2E6F3;
  --accent:#4F46E5;
  --accent2:#7C3AED;
  --accent3:#06B6D4;
  --soft:#EEF0FF;
  --on-accent:#FFFFFF;
  --ok:#047857;
  --glass:rgba(255,255,255,.74);
  --glow:rgba(79,70,229,.30);
  --scrim:rgba(15,23,42,.45);
  --grad:linear-gradient(135deg,#4F46E5,#7C3AED);
  --grad3:linear-gradient(120deg,#4F46E5 0%,#7C3AED 50%,#06B6D4 100%);
  --ease:cubic-bezier(.22,1,.36,1);
  --f-head:"Sora","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#080C1A; --surf:#0F1530; --ink:#E7EBF8; --mut:#9AA6C8;
    --line:rgba(148,163,200,.18); --accent:#8B93FF; --accent2:#A78BFA; --accent3:#22D3EE;
    --soft:rgba(139,147,255,.12); --on-accent:#0A0E22; --ok:#34D399;
    --glass:rgba(15,21,48,.72); --glow:rgba(139,147,255,.35); --scrim:rgba(4,6,16,.62);
    --grad:linear-gradient(135deg,#8B93FF,#A78BFA);
    --grad3:linear-gradient(120deg,#8B93FF 0%,#A78BFA 50%,#22D3EE 100%);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#080C1A; --surf:#0F1530; --ink:#E7EBF8; --mut:#9AA6C8;
  --line:rgba(148,163,200,.18); --accent:#8B93FF; --accent2:#A78BFA; --accent3:#22D3EE;
  --soft:rgba(139,147,255,.12); --on-accent:#0A0E22; --ok:#34D399;
  --glass:rgba(15,21,48,.72); --glow:rgba(139,147,255,.35); --scrim:rgba(4,6,16,.62);
  --grad:linear-gradient(135deg,#8B93FF,#A78BFA);
  --grad3:linear-gradient(120deg,#8B93FF 0%,#A78BFA 50%,#22D3EE 100%);
}

/* ---------- Base ---------- */
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 15.5px/1.6 var(--f-body);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
h1,h2,h3{font-family:var(--f-head);
  font-weight:700;line-height:1.15;margin:0;letter-spacing:-.02em}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
::selection{background:var(--accent);color:var(--on-accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;
  box-shadow:0 0 0 5px var(--glow)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes drift{
  0%{transform:translate3d(-3%,-2%,0) scale(1)}
  50%{transform:translate3d(3%,2%,0) scale(1.08)}
  100%{transform:translate3d(-2%,3%,0) scale(1.02)}
}
@keyframes sheen{from{transform:translateX(-130%) skewX(-20deg)}to{transform:translateX(230%) skewX(-20deg)}}
@keyframes slide-in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes sweep{from{transform:translateX(-120%)}to{transform:translateX(330%)}}
@keyframes pop{0%{opacity:0;transform:scale(.9)}60%{opacity:1;transform:scale(1.04)}100%{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:292px 1fr;min-height:100vh}
.side{
  position:sticky;top:0;height:100vh;overflow:auto;
  padding:22px 14px;
  background:
    radial-gradient(130% 42% at 0% 0%,var(--soft),transparent 70%),
    var(--surf);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:4px;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
}
main{padding:0;max-width:100%;width:100%;display:flex;flex-direction:column}

/* ---------- Marca ---------- */
.brand{display:flex;gap:12px;align-items:center;padding:0 6px 18px;margin-bottom:8px;
  border-bottom:1px solid var(--line)}
.logo{
  position:relative;overflow:hidden;flex:none;
  width:40px;height:40px;border-radius:13px;
  background:var(--grad3);color:#fff;
  display:grid;place-items:center;
  font:800 19px var(--f-head);
  box-shadow:0 6px 18px -4px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);
}
.logo::after{
  content:"";position:absolute;inset:0;width:40%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  animation:sheen 1.3s .5s var(--ease) 1 both;
}
.brand b{font:700 15px/1.2 var(--f-head);letter-spacing:-.015em;display:block}
.brand small{color:var(--mut);font-size:12.5px}
[data-home]{cursor:pointer;transition:color .2s}
[data-home]:hover{color:var(--accent)}

/* ---------- Navegación lateral ---------- */
.nav-all{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  border:1px solid transparent;border-radius:12px;padding:9px 10px;font-weight:600;
  transition:background .2s,border-color .2s,color .2s,transform .2s var(--ease)}
.nav-all span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-all em,.acc-head em{
  font-style:normal;font-size:12px;font-weight:600;color:var(--mut);
  font-variant-numeric:tabular-nums;
  min-width:24px;text-align:center;padding:1px 8px;border-radius:99px;
  background:var(--soft);transition:background .2s,color .2s;
}
.nav-all:hover{background:var(--soft)}
.nav-all:active,.acc-head:active{transform:scale(.985)}
.nav-all[aria-pressed="true"]{
  border-color:color-mix(in srgb,var(--accent) 45%,transparent);
  background:var(--soft);color:var(--accent);
}
.nav-all[aria-pressed="true"] em{background:var(--accent);color:var(--on-accent)}

.acc{border:1px solid transparent;border-radius:12px;
  transition:border-color .25s,background .25s,box-shadow .25s}
.acc:not(.open):hover{border-color:var(--line)}
.acc.open{border-color:var(--line);background:var(--soft);
  box-shadow:0 8px 24px -14px var(--glow)}
.acc-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  border-radius:11px;padding:9px 10px;font-weight:600;
  transition:background .2s,transform .2s var(--ease)}
/* Punto de color: identifica cada materia */
.acc-head::before{
  content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--c);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 20%,transparent);
  transition:transform .3s var(--ease),box-shadow .3s;
}
.acc-head:hover::before,.acc.open .acc-head::before{
  transform:scale(1.2);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 26%,transparent);
}
.acc-head i{font-style:normal;font-size:15px;color:var(--c)}
.acc-head span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-head:hover{background:var(--soft)}
.acc.open .acc-head{color:var(--accent)}
.acc.open .acc-head em{background:var(--surf);color:var(--accent)}
.caret{font-size:9px;line-height:1;color:var(--mut);transition:transform .3s var(--ease),color .2s}
.acc.open .caret{transform:rotate(90deg);color:var(--accent)}

.acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--ease)}
.acc.open .acc-body{grid-template-rows:1fr}
.acc-inner{overflow:hidden}
.subs{margin:2px 8px 8px 21px;padding-left:10px;border-left:1px solid var(--line)}
.sub{position:relative;display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  font-size:13.5px;color:var(--mut);padding:6px 8px;border-radius:8px;line-height:1.35;
  transition:background .2s,color .2s,transform .25s var(--ease)}
/* Punto de estado: gris pendiente, verde completo */
.sub::before{
  content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--line);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--mut) 35%,transparent);
  transition:background .2s,box-shadow .2s,transform .25s var(--ease);
}
.sub span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub em{font-style:normal;font-size:11.5px;color:var(--accent);font-variant-numeric:tabular-nums}
.sub:hover{background:var(--surf);color:var(--ink);transform:translateX(3px)}
.sub:hover::before{background:var(--accent);box-shadow:none;transform:scale(1.35)}
/* Al abrir una materia, los cursos entran en cascada */
.acc.open .sub{animation:slide-in .38s var(--ease) both}
.acc.open .sub:nth-child(2){animation-delay:.04s}
.acc.open .sub:nth-child(3){animation-delay:.08s}
.acc.open .sub:nth-child(4){animation-delay:.12s}
.acc.open .sub:nth-child(5){animation-delay:.16s}
.acc.open .sub:nth-child(6){animation-delay:.2s}
.acc.open .sub:nth-child(7){animation-delay:.24s}
.acc.open .sub:nth-child(n+8){animation-delay:.28s}
/* Tema completo: verde y negrita */
.sub.done span{color:var(--ok);font-weight:700}
.sub.done em{color:var(--ok);font-weight:700}
.sub.done::before{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}

/* ---------- Progreso lateral ---------- */
.me{margin-top:auto;padding:16px;border:1px solid var(--line);border-radius:16px;font-size:13px;
  background:linear-gradient(160deg,var(--soft),transparent 80%),var(--surf);
  box-shadow:0 10px 30px -20px var(--glow)}
.me b{font:800 26px/1 var(--f-head);letter-spacing:-.03em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;margin-right:2px}
.me small{display:block;color:var(--mut);font-size:12.5px;margin-top:8px}
/* Mensaje al completar todos los temas */
.me small.ok{
  color:var(--ok);font-weight:800;font-size:13px;line-height:1.4;
  overflow-wrap:anywhere;text-wrap:balance;
  animation:pop .55s var(--ease) both;
}
.bar{height:8px;border-radius:99px;background:var(--soft);border:1px solid var(--line);overflow:hidden}
.bar u{position:relative;overflow:hidden;display:block;height:100%;border-radius:99px;
  background:var(--grad3);
  transition:width .6s var(--ease)}
/* Destello suave que recorre la barra */
.bar u::after{content:"";position:absolute;top:0;bottom:0;left:0;width:35%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  animation:sweep 2.8s ease-in-out infinite}

/* ---------- Área de contenido ---------- */
.content-frame{
  flex:1;border:0;width:100%;min-height:calc(100vh - 80px);
  background:var(--surf);border-bottom:1px solid var(--line);
  animation:fade .5s ease both;
}
.content-bar{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:13px 26px;
  background:var(--glass);
  -webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid var(--line);
  box-shadow:0 12px 30px -24px rgba(15,23,42,.45);
  flex-wrap:wrap;
}
.content-bar h2{font-size:18px;font-weight:700;margin:0;letter-spacing:-.02em}
.content-bar .actions{display:flex;gap:8px;align-items:center}
.btn{
  padding:9px 18px;font-weight:600;border-radius:11px;
  background:var(--grad);color:var(--on-accent);border:1px solid transparent;
  box-shadow:0 8px 20px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .25s var(--ease),box-shadow .25s,filter .2s,background .2s,color .2s;
}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08);
  box-shadow:0 12px 26px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.25)}
.btn:active{transform:translateY(0) scale(.97)}
/* Completo: verde, sin acción pendiente */
.btn.ghost,.btn.ghost:hover{
  background:color-mix(in srgb,var(--ok) 12%,var(--surf));color:var(--ok);
  border-color:color-mix(in srgb,var(--ok) 50%,transparent);
  box-shadow:none;transform:none;filter:none;cursor:default;font-weight:700;
}

/* ---------- Placeholder inicial ---------- */
.welcome{
  position:relative;isolation:isolate;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:calc(100vh - 80px);padding:40px;text-align:center;color:var(--ink);
}
/* Aurora de color que se desplaza despacio */
.welcome::before{
  content:"";position:absolute;inset:-25%;z-index:-2;
  background:
    radial-gradient(38% 38% at 22% 28%,color-mix(in srgb,var(--accent) 24%,transparent),transparent 72%),
    radial-gradient(34% 34% at 78% 22%,color-mix(in srgb,var(--accent3) 22%,transparent),transparent 72%),
    radial-gradient(42% 42% at 66% 82%,color-mix(in srgb,var(--accent2) 22%,transparent),transparent 72%);
  filter:blur(36px);
  animation:drift 20s ease-in-out infinite alternate;
}
/* Trama de puntos que se desvanece hacia los bordes */
.welcome::after{
  content:"";position:absolute;inset:0;z-index:-1;
  background-image:radial-gradient(color-mix(in srgb,var(--mut) 40%,transparent) 1px,transparent 1.4px);
  background-size:24px 24px;
  -webkit-mask-image:radial-gradient(60% 55% at 50% 50%,#000 20%,transparent 100%);
  mask-image:radial-gradient(60% 55% at 50% 50%,#000 20%,transparent 100%);
  opacity:.55;
}
.welcome h2{
  font-size:clamp(32px,6vw,56px);font-weight:800;letter-spacing:-.04em;line-height:1.08;
  margin-bottom:16px;
  background:linear-gradient(100deg,var(--ink) 8%,var(--accent) 52%,var(--accent2) 92%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  animation:rise .9s var(--ease) both;
}
.welcome p{max-width:44ch;margin:0 auto;font-size:clamp(16px,2vw,18.5px);line-height:1.6;
  animation:rise .9s .14s var(--ease) both}

/* ---------- Chips (móvil) ---------- */
.chips{display:none;gap:8px;overflow-x:auto;padding:14px 16px 2px;background:var(--surf);
  border-bottom:1px solid var(--line)}
.chip{flex:none;border:1px solid var(--line);background:var(--surf);border-radius:99px;
  padding:6px 14px;font-size:13.5px;color:var(--mut);
  transition:background .2s,color .2s,border-color .2s,transform .2s var(--ease),box-shadow .2s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{border-color:transparent;background:var(--grad);color:var(--on-accent);
  font-weight:600;box-shadow:0 6px 16px -6px var(--glow)}

/* ---------- Elementos solo para móvil y tablet (ocultos en escritorio) ---------- */
.m-bar,.side-close,.scrim{display:none}

/* ---------- Tablet horizontal (escritorio chico) ---------- */
@media (min-width:861px) and (max-width:1100px){
  .app{grid-template-columns:264px 1fr}
  .content-bar{padding:12px 18px}
}
/* Pantallas táctiles grandes: áreas de toque cómodas */
@media (pointer:coarse) and (min-width:861px){
  .acc-head,.nav-all{padding-top:11px;padding-bottom:11px}
  .sub{padding-top:8px;padding-bottom:8px}
}

/* ---------- Responsive: tablet vertical y móvil ---------- */
@media (max-width:860px){
  .app{display:block;min-height:0}

  /* Barra superior fija con acceso al índice */
  .m-bar{
    display:flex;align-items:center;gap:12px;
    position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
    height:64px;padding:0 16px;
    background:var(--glass);
    -webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);
    border-bottom:1px solid var(--line);
  }
  .m-menu{
    display:inline-flex;align-items:center;gap:10px;flex:none;
    min-height:44px;padding:0 14px;border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);
    border-radius:12px;color:var(--accent);font-weight:600;
    transition:background .2s,transform .2s var(--ease);
  }
  .m-menu:hover{background:var(--soft)}
  .m-menu:active{transform:scale(.96)}
  .burger{position:relative;display:block;width:16px;height:2px;border-radius:2px;background:currentColor}
  .burger::before,.burger::after{content:"";position:absolute;left:0;width:100%;height:2px;
    border-radius:2px;background:currentColor}
  .burger::before{top:-5px}
  .burger::after{top:5px}
  .m-title{flex:1;min-width:0}
  .m-title b{display:block;font:700 15px/1.2 var(--f-head);letter-spacing:-.015em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .m-title small{display:block;color:var(--mut);font-size:12px;line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .m-pct{flex:none;font:800 15px var(--f-head);color:var(--accent);
    font-variant-numeric:tabular-nums}

  /* El panel lateral pasa a ser un cajón deslizable */
  .side{
    display:flex;position:fixed;z-index:50;top:0;left:0;bottom:0;height:auto;
    width:min(88vw,340px);
    padding-top:calc(22px + env(safe-area-inset-top,0px));
    padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));
    overscroll-behavior:contain;
    transform:translateX(-102%);visibility:hidden;
    transition:transform .38s var(--ease),visibility 0s linear .38s;
  }
  .side.open{
    transform:none;visibility:visible;
    transition:transform .38s var(--ease),visibility 0s;
    box-shadow:0 0 0 1px var(--line),24px 0 60px -10px rgba(8,12,30,.45);
  }
  .side-close{
    display:grid;place-items:center;flex:none;margin-left:auto;
    width:40px;height:40px;border:1px solid var(--line);border-radius:12px;
    color:var(--mut);font-size:16px;line-height:1;
    transition:background .2s,color .2s,transform .3s var(--ease);
  }
  .side-close:hover{background:var(--soft);color:var(--ink);transform:rotate(90deg)}
  .brand{padding-bottom:14px}
  .scrim{
    position:fixed;inset:0;z-index:40;background:var(--scrim);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  }
  .scrim.show{display:block;animation:fade .3s ease both}
  body.drawer-open{overflow:hidden}

  /* Títulos completos y áreas de toque cómodas dentro del cajón */
  .acc-head,.nav-all{padding-top:11px;padding-bottom:11px}
  .sub{padding:10px 8px;font-size:14.5px}
  .sub span{overflow:visible;text-overflow:clip;white-space:normal}

  /* Chips de áreas */
  .chips{display:flex;padding:12px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{min-height:38px;padding:6px 16px}

  /* Barra del tema */
  .content-bar{
    position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:20;
    padding:10px 16px;
  }
  .content-bar[hidden]{display:none}
  .content-bar h2{font-size:17px}
  .content-frame{min-height:calc(100vh - 130px);min-height:calc(100dvh - 130px)}

  /* Pantalla inicial */
  .welcome{min-height:60vh;padding:32px 20px}
}

/* ---------- Móvil ---------- */
@media (max-width:560px){
  .m-bar{padding:0 12px;gap:10px}
  .m-menu{padding:0 12px}
  .chips{padding:10px 12px}
  .content-bar{flex-wrap:nowrap;gap:10px;padding:8px 12px}
  .content-bar h2{
    flex:1;min-width:0;font-size:14.5px;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .content-bar .actions{flex:none}
  .btn{min-height:40px;padding:6px 12px;font-size:13.5px;white-space:nowrap}
}
@media (max-width:380px){
  .m-title small{display:none}
  .m-menu span:last-child{display:none}
  .m-menu{padding:0 14px}
}
</style>
</head>
<body>
<div class="app">

  <!-- ============ PANEL LATERAL ============ -->
  <aside class="side" id="side" aria-label="Índice de cursos">
    <div class="brand">
      <div class="logo">D</div>
      <div><b data-home role="button" tabindex="0" title="Volver al inicio">Capacitación Jurídica</b><small>Defensoría Oficial 6</small></div>
      <button class="side-close" id="btn-close" type="button" aria-label="Cerrar índice">✕</button>
    </div>

    <nav id="nav"></nav>

    <div class="me">
      <b id="mePct">0%</b> completado
      <div class="bar" style="margin-top:8px"><u id="meBar" style="width:0"></u></div>
      <small id="meTxt" aria-live="polite"></small>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <!-- ============ CONTENIDO PRINCIPAL ============ -->
  <main>
    <header class="m-bar" id="m-bar">
      <button class="m-menu" id="btn-menu" type="button" aria-label="Abrir índice de cursos"
              aria-controls="side" aria-expanded="false">
        <span class="burger" aria-hidden="true"></span><span>Cursos</span>
      </button>
      <div class="m-title"><b data-home role="button" tabindex="0" title="Volver al inicio">Capacitación Jurídica</b><small>Defensoría Oficial 6</small></div>
      <span class="m-pct" id="mPct" aria-hidden="true">0%</span>
    </header>

    <div class="chips" id="chips" role="group" aria-label="Áreas"></div>

    <div id="content-bar" class="content-bar" hidden>
      <h2 id="cur-title"></h2>
      <div class="actions">
        <button id="btn-complete" class="btn">Marcar como completo</button>
      </div>
    </div>

    <div id="frame-wrap" class="welcome">
      <h2>Seleccioná un curso</h2>
      <p>Elegí un tema en el panel lateral. El contenido se abrirá aquí, a pantalla completa.</p>
    </div>
  </main>
</div>

<script>

  {id:'ley52', a:'nin', t:'Defensor de los Derechos de Niños, Niñas y Adolescentes', n:'Ley IV – N.º 52 (Misiones)', url:'https://fioravanteweb.github.io/capacitacion/nnya2'},
  {id:'pj', a:'nin', t:'Régimen Penal Juvenil', n:'Ley 27.801', url:'https://fioravanteweb.github.io/capacitacion/penaljuvenil'},
  {id:'map', a:'pro', t:'Mapa del Código Procesal de Misiones', n:'Ley XII – N.º 27', url:'https://fioravanteweb.github.io/capacitacion/misiones1'},
  {id:'map1', a:'pro', t:'Reclamo de Filiación Art 583 CCyC', url:'https://fioravanteweb.github.io/capacitacion/reclamofiliacion'},
  {id:'map2', a:'pro', t:'Comunicación y Contacto', url:'https://fioravanteweb.github.io/capacitacion/cycontacto'},
  {id:'map3', a:'pro', t:'Guarda y Tutela', url:'https://fioravanteweb.github.io/capacitacion/guarda-tutela'},
  {id:'map4', a:'pro', t:'Cuidado Personal', url:'https://fioravanteweb.github.io/capacitacion/cuidadopersonal'},
{id:'map5', a:'pro', t:'Medidas cautelares', url:'https://fioravanteweb.github.io/capacitacion/cautelares'},
{id:'map6', a:'pro', t:'Prueba en materia civil', url:'https://fioravanteweb.github.io/capacitacion/pruebacivil'},
{id:'map7', a:'pro', t:'Prueba en materia familia', url:'https://fioravanteweb.github.io/capacitacion/pruebafamilia'},
{id:'map8', a:'pro', t:'Mediación', url:'https://fioravanteweb.github.io/capacitacion/mediacion'},  
{id:'ali', a:'pro', t:'Juicio de alimentos', n:'Código Procesal, arts. 696 a 710', url:'https://fioravanteweb.github.io/capacitacion/misiones2'},
  {id:'dvm', a:'pro', t:'Juicio de divorcio', n:'Código Procesal, arts. 715 y 716', url:'https://fioravanteweb.github.io/capacitacion/misiones3'},
  {id:'dvm1', a:'pro', t:'Amparo', url:'https://fioravanteweb.github.io/capacitacion/amparo'},
  {id:'vio', a:'pro', t:'Violencia familiar', n:'Ley XIV – N.º 6 y arts. 655 a 658', url:'https://fioravanteweb.github.io/capacitacion/misiones4'},
{id:'des1', a:'pro', t:'Juicio Ejecutivo', url:'https://fioravanteweb.github.io/capacitacion/ejecutivo'},  
{id:'des', a:'pro', t:'Juicio de desalojo', n:'Código Procesal, arts. 623 a 635', url:'https://fioravanteweb.github.io/capacitacion/misiones5'},
  /* --- Nociones del Proceso (orden manual) --- */
  {id:'noc1', a:'noc', o:1, t:'En la Ley Procesal Misiones-Ley XII-27', url:'https://fioravanteweb.github.io/capacitacion/procesosLeyXII-27'},
  {id:'noc2', a:'noc', o:2, t:'Proceso de Conocimiento', url:'https://fioravanteweb.github.io/capacitacion/ProcesoConocimiento'},
  {id:'noc3', a:'noc', o:3, t:'Procesos de Ejecución', url:'https://fioravanteweb.github.io/capacitacion/ProcesosEjecucion'},
  {id:'noc4', a:'noc', o:4, t:'Procesos Especiales', url:'https://fioravanteweb.github.io/capacitacion/ProcesosEspeciales'},
  {id:'noc5', a:'noc', o:5, t:'Prueba y Notificaciones', url:'https://fioravanteweb.github.io/capacitacion/prueba'},
  {id:'noc6', a:'noc', o:6, t:'Recursos', url:'https://fioravanteweb.github.io/capacitacion/Recursos'},
  {id:'noc7', a:'noc', o:7, t:'Finalización del Proceso', url:'https://fioravanteweb.github.io/capacitacion/finalizacion'},
  {id:'succ', a:'suc', t:'El proceso sucesorio', n:'CCyC, arts. 2335 a 2362', url:'https://fioravanteweb.github.io/capacitacion/sucesion1'},
  {id:'sucm', a:'suc', t:'Proceso sucesorio en Misiones', n:'Código Procesal, arts. 717 a 763', url:'https://fioravanteweb.github.io/capacitacion/sucesion2'},
{id:'lab1', a:'lab', t:'Defensor del Trabajador', url:'https://fioravanteweb.github.io/capacitacion/defensalaboral'},
{id:'lab2', a:'lab', t:'Proceso Laboral en Misiones', url:'https://fioravanteweb.github.io/capacitacion/procesolaboral'},
  {id:'lab', a:'lab', t:'Modernización Laboral', n:'Ley 27.802', url:'https://fioravanteweb.github.io/capacitacion/laboral1'},
  {id:'rpjcom0', a:'pen', t:'Principios generales', url:'https://fioravanteweb.github.io/capacitacion/cp-general'},
  {id:'rpjcom1', a:'pen', t:'Delitos y Penas', url:'https://fioravanteweb.github.io/capacitacion/cp-especial'},
{id:'rpjcom2', a:'pen', t:'Proceso Penal en Misiones', url:'https://fioravanteweb.github.io/capacitacion/procesalpenal'},
  {id:'rpjcom', a:'pen', t:'Régimen Penal Juvenil Comentado', url:'https://fioravanteweb.github.io/capacitacion/rpj-comentado'},
  {id:'rpjres', a:'pen', t:'Régimen Penal Juvenil Resumen', url:'https://fioravanteweb.github.io/capacitacion/regimenpenaljuvenil'},
  {id:'rpjade', a:'pen', t:'Régimen Penal Juvenil-ADePRA', url:'https://fioravanteweb.github.io/capacitacion/adepra-penaljuvenil'},
  {id:'rpjrec', a:'pen', t:'Régimen Penal Juvenil-Recomendación', url:'https://fioravanteweb.github.io/capacitacion/penaljuvenil-21'},
  {id:'ciber', a:'ele', t:'Cibercrimen', url:'https://fioravanteweb.github.io/capacitacion/cibercrimen'},
  {id:'pruele', a:'ele', t:'Prueba Electrónica', url:'https://fioravanteweb.github.io/capacitacion/pruebaelectronica'}
];

/* ==================== ESTADO ==================== */
const $ = s => document.querySelector(s);
let P = {}, cur = null, curId = null, openArea = null;
try { P = JSON.parse(localStorage.getItem('campus-jur') || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem('campus-jur', JSON.stringify(P)); } catch (e) {} };
const isDone = id => P[id] === true;

/* ==================== PROGRESO ==================== */
function stats(){
  const total = C.length;
  const hechas = C.filter(c => isDone(c.id)).length;
  const p = total ? Math.round(hechas / total * 100) : 0;
  const todos = total > 0 && hechas === total;
  $('#mePct').textContent = p + '%';
  $('#mPct').textContent = p + '%';
  $('#meBar').style.width = p + '%';
  const txt = $('#meTxt');
  txt.classList.toggle('ok', todos);
  txt.textContent = todos
    ? '✓ Has completado todos los temas'
    : hechas + ' de ' + total + ' cursos completos';
}

/* ==================== NAVEGACIÓN (ACORDEÓN) ==================== */
/* Ordena por `o` si existe; si no, alfabéticamente por título */
function ordenar(a, b){
  const oa = a.o ?? 999, ob = b.o ?? 999;
  if (oa !== ob) return oa - ob;
  return a.t.localeCompare(b.t, 'es');
}

function buildNav(){
  let h = `<button class="nav-all" data-k="all" aria-pressed="true">
             <span>Todos los cursos</span><em>${C.length}</em>
           </button>`;

  for (const k in A){
    const [nombre, color] = A[k];
    const lista = C.filter(c => c.a === k).sort(ordenar);
    h += `<div class="acc" data-area="${k}">
            <button class="acc-head" data-head="${k}" aria-expanded="false" style="--c:${color}">
              <span>${nombre}</span><em>${lista.length}</em><b class="caret">▸</b>
            </button>
            <div class="acc-body"><div class="acc-inner"><div class="subs">
              ${lista.map(c => `<button class="sub" data-id="${c.id}">
                                  <span>${c.t}</span><em></em>
                                </button>`).join('')}
            </div></div></div>
          </div>`;
  }
  $('#nav').innerHTML = h;
}

function buildChips(){
  let h = `<button class="chip" data-k="all" aria-pressed="true">Todos</button>`;
  for (const k in A) h += `<button class="chip" data-k="${k}">${A[k][0]}</button>`;
  $('#chips').innerHTML = h;
}

/* Número junto al título = temas pendientes (baja al marcar completos) */
function setCount(el, pendientes){
  el.textContent = pendientes;
  el.title = pendientes === 1 ? '1 tema pendiente' : pendientes + ' temas pendientes';
}

function syncNav(){
  document.querySelectorAll('#nav .sub').forEach(b => {
    const c = C.find(x => x.id === b.dataset.id);
    const done = isDone(c.id);
    b.classList.toggle('done', done);
    b.querySelector('em').textContent = done ? 'Completo' : '';
  });
  setCount($('.nav-all em'), C.filter(c => !isDone(c.id)).length);
  $('.nav-all').setAttribute('aria-pressed', cur === 'all');
  document.querySelectorAll('.chip').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.k === cur));
  document.querySelectorAll('#nav .acc').forEach(a => {
    const on = a.dataset.area === openArea;
    a.classList.toggle('open', on);
    a.querySelector('.acc-head').setAttribute('aria-expanded', on);
    setCount(a.querySelector('.acc-head em'),
             C.filter(c => c.a === a.dataset.area && !isDone(c.id)).length);
  });
}

/* ==================== ÍNDICE DESLIZABLE (MÓVIL Y TABLET) ==================== */
const isDrawerOpen = () => $('#side').classList.contains('open');

function openDrawer(){
  $('#side').classList.add('open');
  $('#scrim').classList.add('show');
  document.body.classList.add('drawer-open');
  $('main').inert = true;
  $('#btn-menu').setAttribute('aria-expanded', 'true');
  $('#btn-close').focus();
}

function closeDrawer(devolverFoco){
  if (!isDrawerOpen()) return;
  $('#side').classList.remove('open');
  $('#scrim').classList.remove('show');
  document.body.classList.remove('drawer-open');
  $('main').inert = false;
  $('#btn-menu').setAttribute('aria-expanded', 'false');
  if (devolverFoco) $('#btn-menu').focus();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDrawer(true);
});
document.addEventListener('keydown', e => {
  const h = e.target.closest && e.target.closest('[data-home]');
  if (h && (e.key === 'Enter' || e.key === ' ')){
    e.preventDefault();
    h.click();
  }
});
const mqEscritorio = window.matchMedia('(min-width:861px)');
mqEscritorio.addEventListener('change', e => { if (e.matches) closeDrawer(); });

/* ==================== CARGA DE CONTENIDO ==================== */
function loadCourse(id){
  const c = C.find(x => x.id === id);
  if (!c) return;

  cur = c.id;
  curId = c.id;

  // Barra superior
  $('#content-bar').hidden = false;
  $('#cur-title').textContent = c.t;

  // Botón completo
  const btn = $('#btn-complete');
  btn.textContent = isDone(c.id) ? 'Completo ✓' : 'Marcar como completo';
  btn.disabled = isDone(c.id);
  btn.classList.toggle('ghost', isDone(c.id));

  // Iframe
  const wrap = $('#frame-wrap');
  wrap.className = '';
  wrap.innerHTML = `<iframe class="content-frame" src="${c.url}" title="${c.t}" loading="lazy"></iframe>`;

  refreshSidebar();
}

/* Volver a la pantalla de inicio (sin curso abierto) */
const WELCOME_HTML = $('#frame-wrap').innerHTML;

function goHome(){
  cur = 'all';
  curId = null;
  openArea = null;

  $('#content-bar').hidden = true;
  $('#cur-title').textContent = '';

  const wrap = $('#frame-wrap');
  wrap.className = 'welcome';
  wrap.innerHTML = WELCOME_HTML;   // reemplaza el iframe del curso

  window.scrollTo(0, 0);
  refreshSidebar();
}

function refreshSidebar(){
  stats();
  syncNav();
}

/* ==================== EVENTOS ==================== */
document.addEventListener('click', e => {
  // Abrir / cerrar el índice (móvil y tablet)
  if (e.target.closest('#btn-menu')){ openDrawer(); return; }
  if (e.target.closest('#btn-close') || e.target.closest('#scrim')){ closeDrawer(true); return; }

  // Título "Capacitación Jurídica" o "Todos los cursos": volver al inicio
  if (e.target.closest('[data-home]') || e.target.closest('.nav-all')){
    goHome();
    closeDrawer();
    return;
  }

  // Acordeón
  const head = e.target.closest('[data-head]');
  if (head){
    const k = head.dataset.head;
    if (openArea === k){ openArea = null; cur = 'all'; }
    else { openArea = k; cur = k; }
    refreshSidebar();
    return;
  }

  // Chips / "Todos"
  const k = e.target.closest('[data-k]');
  if (k){
    cur = k.dataset.k;
    openArea = cur === 'all' ? null : cur;
    refreshSidebar();
    if (k.classList.contains('chip')) openDrawer();
    return;
  }

  // Curso (sub)
  const sub = e.target.closest('.sub');
  if (sub){
    loadCourse(sub.dataset.id);
    closeDrawer();
    return;
  }

  // Botón completo
  if (e.target.closest('#btn-complete')){
    if (!curId) return;
    P[curId] = true;
    save();
    // Actualizar botón
    const btn = $('#btn-complete');
    btn.textContent = 'Completo ✓';
    btn.disabled = true;
    btn.classList.add('ghost');
    refreshSidebar();
    return;
  }
});

/* ==================== INICIO ==================== */
buildNav();
buildChips();
refreshSidebar();
</script>
</body>
</html>
