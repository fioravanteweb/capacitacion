<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capacitación Jurídica · Defensoría Oficial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens ---------- */
:root{
  --bg:#F5F9FF;
  --surf:#FFFFFF;
  --ink:#0B2545;
  --mut:#4B6A99;
  --line:#B9D2F2;
  --accent:#1D4ED8;
  --soft:#EAF2FE;
  --on-accent:#FFFFFF;
  --ok:#16783C;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08111F; --surf:#0E1B31; --ink:#DCE8FA; --mut:#8FAAD2;
    --line:#27436E; --accent:#7FA9F0; --soft:#132340; --on-accent:#08111F;
    --ok:#4ADE80;
  }
}
:root[data-theme="dark"]{
  --bg:#08111F; --surf:#0E1B31; --ink:#DCE8FA; --mut:#8FAAD2;
  --line:#27436E; --accent:#7FA9F0; --soft:#132340; --on-accent:#08111F;
  --ok:#4ADE80;
}

/* ---------- Base ---------- */
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 15.5px/1.65 "Plus Jakarta Sans",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
h1,h2,h3{font-family:"Bricolage Grotesque","Plus Jakarta Sans",sans-serif;
  font-weight:700;line-height:1.2;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:286px 1fr;min-height:100vh}
.side{
  position:sticky;top:0;height:100vh;overflow:auto;
  padding:22px 16px;background:var(--surf);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:6px;
}
main{padding:0;max-width:100%;width:100%;display:flex;flex-direction:column}

/* ---------- Marca ---------- */
.brand{display:flex;gap:10px;align-items:center;padding:0 6px 16px;margin-bottom:6px;
  border-bottom:1px solid var(--line)}
.logo{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--accent);
  color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:18px}
.brand b{font:700 15.5px/1.15 "Bricolage Grotesque",sans-serif;display:block}
.brand small{color:var(--mut);font-size:12px}
[data-home]{cursor:pointer}

/* ---------- Navegación lateral ---------- */
.nav-all{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  border:1px solid transparent;border-radius:10px;padding:8px 10px;font-weight:600}
.nav-all span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-all em{font-style:normal;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.nav-all:hover{border-color:var(--line);background:var(--soft)}
.nav-all[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}

.acc{border:1px solid transparent;border-radius:10px;transition:border-color .18s,background .18s}
.acc.open{border-color:var(--line);background:var(--soft)}
.acc-head{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  border-radius:9px;padding:8px 10px;font-weight:600}
.acc-head i{font-style:normal;font-size:15px;color:var(--c)}
.acc-head span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-head em{font-style:normal;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.acc-head:hover{background:var(--soft)}
.caret{font-size:9px;line-height:1;color:var(--mut);transition:transform .2s}
.acc.open .caret{transform:rotate(90deg)}

.acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .24s ease}
.acc.open .acc-body{grid-template-rows:1fr}
.acc-inner{overflow:hidden}
.subs{margin:2px 8px 8px 20px;padding-left:10px;border-left:1px solid var(--line)}
.sub{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  font-size:13.5px;color:var(--mut);padding:5px 8px;border-radius:7px;line-height:1.35}
.sub span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub em{font-style:normal;font-size:11.5px;color:var(--accent);font-variant-numeric:tabular-nums}
.sub:hover{background:var(--surf);color:var(--ink)}
/* Tema completo: verde y negrita */
.sub.done span{color:var(--ok);font-weight:700}
.sub.done em{color:var(--ok);font-weight:700}

/* ---------- Progreso lateral ---------- */
.me{margin-top:auto;padding:14px;border:1px solid var(--line);border-radius:12px;font-size:13px}
.me b{font:800 20px "Bricolage Grotesque",sans-serif}
.me small{display:block;color:var(--mut);font-size:12px;margin-top:6px}
/* Mensaje al completar todos los temas */
.me small.ok{
  color:var(--ok);font-weight:800;font-size:13px;line-height:1.4;
  overflow-wrap:anywhere;text-wrap:balance;
}
.bar{height:6px;border-radius:99px;background:var(--soft);border:1px solid var(--line);overflow:hidden}
.bar u{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s}

/* ---------- Área de contenido ---------- */
.content-frame{
  flex:1;border:0;width:100%;min-height:calc(100vh - 80px);
  background:var(--surf);border-bottom:1px solid var(--line);
}
.content-bar{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:12px 24px;background:var(--surf);border-bottom:1px solid var(--line);
  flex-wrap:wrap;
}
.content-bar h2{font-size:18px;font-weight:700;margin:0}
.content-bar .actions{display:flex;gap:8px;align-items:center}
.btn{
  padding:8px 16px;font-weight:600;border-radius:9px;
  background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);
  transition:background .15s,color .15s;
}
.btn:hover{background:transparent;color:var(--accent)}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--accent)}
.btn.ghost:hover{background:var(--soft)}

/* ---------- Placeholder inicial ---------- */
.welcome{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:calc(100vh - 80px);padding:40px;text-align:center;color:var(--mut);
}
.welcome h2{font-size:26px;margin-bottom:12px;color:var(--ink)}
.welcome p{max-width:44ch;margin:0 auto}

/* ---------- Chips (móvil) ---------- */
.chips{display:none;gap:8px;overflow-x:auto;padding:14px 16px 2px;background:var(--surf);
  border-bottom:1px solid var(--line)}
.chip{flex:none;border:1px solid var(--line);background:var(--surf);border-radius:99px;
  padding:6px 14px;font-size:13.5px;color:var(--mut)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}

/* ---------- Elementos solo para móvil y tablet (ocultos en escritorio) ---------- */
.m-bar,.side-close,.scrim{display:none}

/* ---------- Tablet horizontal (escritorio chico) ---------- */
@media (min-width:861px) and (max-width:1100px){
  .app{grid-template-columns:260px 1fr}
  .content-bar{padding:12px 18px}
}
/* Pantallas táctiles grandes: áreas de toque cómodas */
@media (pointer:coarse) and (min-width:861px){
  .acc-head,.nav-all{padding-top:11px;padding-bottom:11px}
  .sub{padding-top:8px;padding-bottom:8px}
}

/* ---------- Responsive: tablet vertical y móvil ---------- */
@media (max-width:860px){
  .app{display:block;min-height:0}

  /* Barra superior fija con acceso al índice */
  .m-bar{
    display:flex;align-items:center;gap:12px;
    position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
    height:64px;padding:0 16px;
    background:var(--surf);border-bottom:1px solid var(--line);
  }
  .m-menu{
    display:inline-flex;align-items:center;gap:10px;flex:none;
    min-height:44px;padding:0 14px;border:1px solid var(--accent);border-radius:10px;
    color:var(--accent);font-weight:600;
  }
  .m-menu:hover{background:var(--soft)}
  .burger{position:relative;display:block;width:16px;height:2px;border-radius:2px;background:currentColor}
  .burger::before,.burger::after{content:"";position:absolute;left:0;width:100%;height:2px;
    border-radius:2px;background:currentColor}
  .burger::before{top:-5px}
  .burger::after{top:5px}
  .m-title{flex:1;min-width:0}
  .m-title b{display:block;font:700 15px/1.2 "Bricolage Grotesque",sans-serif;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .m-title small{display:block;color:var(--mut);font-size:12px;line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .m-pct{flex:none;font:800 15px "Bricolage Grotesque",sans-serif;color:var(--accent);
    font-variant-numeric:tabular-nums}

  /* El panel lateral pasa a ser un cajón deslizable */
  .side{
    display:flex;position:fixed;z-index:50;top:0;left:0;bottom:0;height:auto;
    width:min(88vw,340px);
    padding-top:calc(22px + env(safe-area-inset-top,0px));
    padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));
    overscroll-behavior:contain;
    transform:translateX(-102%);visibility:hidden;
    transition:transform .25s ease,visibility 0s linear .25s;
  }
  .side.open{
    transform:none;visibility:visible;
    transition:transform .25s ease,visibility 0s;
    box-shadow:0 0 0 1px var(--line),14px 0 40px rgba(8,17,31,.35);
  }
  .side-close{
    display:grid;place-items:center;flex:none;margin-left:auto;
    width:40px;height:40px;border:1px solid var(--line);border-radius:10px;
    color:var(--mut);font-size:16px;line-height:1;
  }
  .side-close:hover{background:var(--soft);color:var(--ink)}
  .brand{padding-bottom:14px}
  .scrim{
    position:fixed;inset:0;z-index:40;background:rgba(8,17,31,.5);
  }
  .scrim.show{display:block}
  body.drawer-open{overflow:hidden}

  /* Títulos completos y áreas de toque cómodas dentro del cajón */
  .acc-head,.nav-all{padding-top:11px;padding-bottom:11px}
  .sub{padding:10px 8px;font-size:14.5px}
  .sub span{overflow:visible;text-overflow:clip;white-space:normal}

  /* Chips de áreas */
  .chips{display:flex;padding:12px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{min-height:38px;padding:6px 16px}

  /* Barra del tema */
  .content-bar{
    position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:20;
    padding:10px 16px;
  }
  .content-bar[hidden]{display:none}
  .content-bar h2{font-size:17px}
  .content-frame{min-height:calc(100vh - 130px);min-height:calc(100dvh - 130px)}

  /* Pantalla inicial */
  .welcome{min-height:60vh;padding:32px 20px}
  .welcome h2{font-size:22px}
}

/* ---------- Móvil ---------- */
@media (max-width:560px){
  .m-bar{padding:0 12px;gap:10px}
  .m-menu{padding:0 12px}
  .chips{padding:10px 12px}
  .content-bar{flex-wrap:nowrap;gap:10px;padding:8px 12px}
  .content-bar h2{
    flex:1;min-width:0;font-size:14.5px;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .content-bar .actions{flex:none}
  .btn{min-height:40px;padding:6px 12px;font-size:13.5px;white-space:nowrap}
  .welcome h2{font-size:20px}
}
@media (max-width:380px){
  .m-title small{display:none}
  .m-menu span:last-child{display:none}
  .m-menu{padding:0 14px}
}
</style>
</head>
<body>
<div class="app">

  <!-- ============ PANEL LATERAL ============ -->
  <aside class="side" id="side" aria-label="Índice de cursos">
    <div class="brand">
      <div class="logo">D</div>
      <div><b data-home role="button" tabindex="0" title="Volver al inicio">Capacitación Jurídica</b><small>Defensoría Oficial 6</small></div>
      <button class="side-close" id="btn-close" type="button" aria-label="Cerrar índice">✕</button>
    </div>

    <nav id="nav"></nav>

    <div class="me">
      <b id="mePct">0%</b> completado
      <div class="bar" style="margin-top:8px"><u id="meBar" style="width:0"></u></div>
      <small id="meTxt" aria-live="polite"></small>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <!-- ============ CONTENIDO PRINCIPAL ============ -->
  <main>
    <header class="m-bar" id="m-bar">
      <button class="m-menu" id="btn-menu" type="button" aria-label="Abrir índice de cursos"
              aria-controls="side" aria-expanded="false">
        <span class="burger" aria-hidden="true"></span><span>Cursos</span>
      </button>
      <div class="m-title"><b data-home role="button" tabindex="0" title="Volver al inicio">Capacitación Jurídica</b><small>Defensoría Oficial 6</small></div>
      <span class="m-pct" id="mPct" aria-hidden="true">0%</span>
    </header>

    <div class="chips" id="chips" role="group" aria-label="Áreas"></div>

    <div id="content-bar" class="content-bar" hidden>
      <h2 id="cur-title"></h2>
      <div class="actions">
        <button id="btn-complete" class="btn">Marcar como completo</button>
      </div>
    </div>

    <div id="frame-wrap" class="welcome">
      <h2>Seleccioná un curso</h2>
      <p>Elegí un tema en el panel lateral. El contenido se abrirá aquí, a pantalla completa.</p>
    </div>
  </main>
</div>

<script>
/* ==================== DATOS ==================== */
const A = {
  def:['Defensor Oficial','#0F766E'],
  cap:['Capacidad personas','#1E3A8A'],
  fam:['Familia','#1D4ED8'],
  nin:['Niñez y adolescencia','#0E7490'],
  pro:['Procesos en Misiones','#0369A1'],
  suc:['Sucesiones','#4338CA'],
  lab:['Laboral','#6D28D9'],
  pen:['Penal','#B91C1C']
};

const C = [
  {id:'def1', a:'def', t:'Defensor de Ausentes', url:'https://fioravanteweb.github.io/capacitacion/ausente'},
  {id:'def2', a:'def', t:'Medidas preliminares', url:'https://fioravanteweb.github.io/capacitacion/medidas'},
  {id:'cap1', a:'cap', t:'Capacidad: principios generales', n:'CCyC, arts. 22 a 24', url:'https://fioravanteweb.github.io/capacitacion/capacidad1'},
  {id:'cap3', a:'cap', t:'Restricciones a la capacidad', n:'CCyC, arts. 31 a 50', url:'https://fioravanteweb.github.io/capacitacion/capacidad2'},
  {id:'cap2', a:'cap', t:'Salud Mental Internaciones', url:'https://fioravanteweb.github.io/capacitacion/saludmental'},
  {id:'rep', a:'cap', t:'Representación y asistencia', n:'CCyC, arts. 100 a 103', url:'https://fioravanteweb.github.io/capacitacion/capacidad3'},
  {id:'tut', a:'cap', t:'Tutela', n:'CCyC, arts. 104 a 137', url:'https://fioravanteweb.github.io/capacitacion/capacidad4'},
  {id:'rp', a:'fam', t:'Adopción', url:'https://fioravanteweb.github.io/capacitacion/adopcion'},
  {id:'rp4', a:'fam', t:'Alimentos', url:'https://fioravanteweb.github.io/capacitacion/alimentos'},
  {id:'rp1', a:'fam', t:'Filiacion', url:'https://fioravanteweb.github.io/capacitacion/filiacion'},
  {id:'rp5', a:'fam', t:'Comunicacion', url:'https://fioravanteweb.github.io/capacitacion/comunicacion'},
  {id:'rp2', a:'fam', t:'Procesos de Familia CCyC', url:'https://fioravanteweb.github.io/capacitacion/familia0'},
  {id:'rp3', a:'fam', t:'Responsabilidad parental', n:'CCyC, arts. 638 a 704', url:'https://fioravanteweb.github.io/capacitacion/familia1'},
  {id:'div', a:'fam', t:'Disolución del matrimonio', n:'CCyC, arts. 435 a 445', url:'https://fioravanteweb.github.io/capacitacion/familia2'},
  {id:'ley16', a:'nin', t:'Protección integral de la niñez', n:'Ley II – N.º 16 (Misiones)', url:'https://fioravanteweb.github.io/capacitacion/nnya1'},
  {id:'ley52', a:'nin', t:'Defensor de los Derechos de Niños, Niñas y Adolescentes', n:'Ley IV – N.º 52 (Misiones)', url:'https://fioravanteweb.github.io/capacitacion/nnya2'},
  {id:'pj', a:'nin', t:'Régimen Penal Juvenil', n:'Ley 27.801', url:'https://fioravanteweb.github.io/capacitacion/penaljuvenil'},
  {id:'map', a:'pro', t:'Mapa del Código Procesal de Misiones', n:'Ley XII – N.º 27', url:'https://fioravanteweb.github.io/capacitacion/misiones1'},
  {id:'map1', a:'pro', t:'Reclamo de Filiación Art 583 CCyC', url:'https://fioravanteweb.github.io/capacitacion/reclamofiliacion'},
  {id:'map2', a:'pro', t:'Comunicación y Contacto', url:'https://fioravanteweb.github.io/capacitacion/cycontacto'},
  {id:'map3', a:'pro', t:'Guarda y Tutela', url:'https://fioravanteweb.github.io/capacitacion/guarda-tutela'},
  {id:'map4', a:'pro', t:'Cuidado Personal', url:'https://fioravanteweb.github.io/capacitacion/cuidadopersonal'},
{id:'map5', a:'pro', t:'Medidas cautelares', url:'https://fioravanteweb.github.io/capacitacion/cautelares'},
{id:'map6', a:'pro', t:'Prueba en materia civil', url:'https://fioravanteweb.github.io/capacitacion/pruebacivil'},
{id:'map7', a:'pro', t:'Prueba en materia familia', url:'https://fioravanteweb.github.io/capacitacion/pruebafamilia'},
{id:'map8', a:'pro', t:'Mediación', url:'https://fioravanteweb.github.io/capacitacion/mediacion'},  
{id:'ali', a:'pro', t:'Juicio de alimentos', n:'Código Procesal, arts. 696 a 710', url:'https://fioravanteweb.github.io/capacitacion/misiones2'},
  {id:'dvm', a:'pro', t:'Juicio de divorcio', n:'Código Procesal, arts. 715 y 716', url:'https://fioravanteweb.github.io/capacitacion/misiones3'},
  {id:'dvm1', a:'pro', t:'Amparo', url:'https://fioravanteweb.github.io/capacitacion/amparo'},
  {id:'vio', a:'pro', t:'Violencia familiar', n:'Ley XIV – N.º 6 y arts. 655 a 658', url:'https://fioravanteweb.github.io/capacitacion/misiones4'},
{id:'des1', a:'pro', t:'Juicio Ejecutivo', url:'https://fioravanteweb.github.io/capacitacion/ejecutivo'},  
{id:'des', a:'pro', t:'Juicio de desalojo', n:'Código Procesal, arts. 623 a 635', url:'https://fioravanteweb.github.io/capacitacion/misiones5'},
  {id:'succ', a:'suc', t:'El proceso sucesorio', n:'CCyC, arts. 2335 a 2362', url:'https://fioravanteweb.github.io/capacitacion/sucesion1'},
  {id:'sucm', a:'suc', t:'Proceso sucesorio en Misiones', n:'Código Procesal, arts. 717 a 763', url:'https://fioravanteweb.github.io/capacitacion/sucesion2'},
{id:'lab1', a:'lab', t:'Defensor del Trabajador', url:'https://fioravanteweb.github.io/capacitacion/defensalaboral'},
{id:'lab2', a:'lab', t:'Juicio Laboral en Misiones', url:'https://fioravanteweb.github.io/capacitacion/procesolaboral'},
  {id:'lab', a:'lab', t:'Modernización Laboral', n:'Ley 27.802', url:'https://fioravanteweb.github.io/capacitacion/laboral1'},
  {id:'rpjcom0', a:'pen', t:'Principios generales', url:'https://fioravanteweb.github.io/capacitacion/cp-general'},
  {id:'rpjcom1', a:'pen', t:'Delitos y Penas', url:'https://fioravanteweb.github.io/capacitacion/cp-especial'},
  {id:'rpjcom', a:'pen', t:'Régimen Penal Juvenil Comentado', url:'https://fioravanteweb.github.io/capacitacion/rpj-comentado'}
];

/* ==================== ESTADO ==================== */
const $ = s => document.querySelector(s);
let P = {}, cur = null, curId = null, openArea = null;
try { P = JSON.parse(localStorage.getItem('campus-jur') || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem('campus-jur', JSON.stringify(P)); } catch (e) {} };
const isDone = id => P[id] === true;

/* ==================== PROGRESO ==================== */
function stats(){
  const total = C.length;
  const hechas = C.filter(c => isDone(c.id)).length;
  const p = total ? Math.round(hechas / total * 100) : 0;
  const todos = total > 0 && hechas === total;
  $('#mePct').textContent = p + '%';
  $('#mPct').textContent = p + '%';
  $('#meBar').style.width = p + '%';
  const txt = $('#meTxt');
  txt.classList.toggle('ok', todos);
  txt.textContent = todos
    ? '✓ Has completado todos los temas'
    : hechas + ' de ' + total + ' cursos completos';
}

/* ==================== NAVEGACIÓN (ACORDEÓN) ==================== */
function buildNav(){
  let h = `<button class="nav-all" data-k="all" aria-pressed="true">
             <span>Todos los cursos</span><em>${C.length}</em>
           </button>`;

  for (const k in A){
    const [nombre, color] = A[k];
    const lista = C.filter(c => c.a === k).sort((a,b) => a.t.localeCompare(b.t,'es'));
    h += `<div class="acc" data-area="${k}">
            <button class="acc-head" data-head="${k}" aria-expanded="false" style="--c:${color}">
              <span>${nombre}</span><em>${lista.length}</em><b class="caret">▸</b>
            </button>
            <div class="acc-body"><div class="acc-inner"><div class="subs">
              ${lista.map(c => `<button class="sub" data-id="${c.id}">
                                  <span>${c.t}</span><em></em>
                                </button>`).join('')}
            </div></div></div>
          </div>`;
  }
  $('#nav').innerHTML = h;
}

function buildChips(){
  let h = `<button class="chip" data-k="all" aria-pressed="true">Todos</button>`;
  for (const k in A) h += `<button class="chip" data-k="${k}">${A[k][0]}</button>`;
  $('#chips').innerHTML = h;
}

/* Número junto al título = temas pendientes (baja al marcar completos) */
function setCount(el, pendientes){
  el.textContent = pendientes;
  el.title = pendientes === 1 ? '1 tema pendiente' : pendientes + ' temas pendientes';
}

function syncNav(){
  document.querySelectorAll('#nav .sub').forEach(b => {
    const c = C.find(x => x.id === b.dataset.id);
    const done = isDone(c.id);
    b.classList.toggle('done', done);
    b.querySelector('em').textContent = done ? 'Completo' : '';
  });
  setCount($('.nav-all em'), C.filter(c => !isDone(c.id)).length);
  $('.nav-all').setAttribute('aria-pressed', cur === 'all');
  document.querySelectorAll('.chip').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.k === cur));
  document.querySelectorAll('#nav .acc').forEach(a => {
    const on = a.dataset.area === openArea;
    a.classList.toggle('open', on);
    a.querySelector('.acc-head').setAttribute('aria-expanded', on);
    setCount(a.querySelector('.acc-head em'),
             C.filter(c => c.a === a.dataset.area && !isDone(c.id)).length);
  });
}

/* ==================== ÍNDICE DESLIZABLE (MÓVIL Y TABLET) ==================== */
const isDrawerOpen = () => $('#side').classList.contains('open');

function openDrawer(){
  $('#side').classList.add('open');
  $('#scrim').classList.add('show');
  document.body.classList.add('drawer-open');
  $('main').inert = true;
  $('#btn-menu').setAttribute('aria-expanded', 'true');
  $('#btn-close').focus();
}

function closeDrawer(devolverFoco){
  if (!isDrawerOpen()) return;
  $('#side').classList.remove('open');
  $('#scrim').classList.remove('show');
  document.body.classList.remove('drawer-open');
  $('main').inert = false;
  $('#btn-menu').setAttribute('aria-expanded', 'false');
  if (devolverFoco) $('#btn-menu').focus();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDrawer(true);
});
document.addEventListener('keydown', e => {
  const h = e.target.closest && e.target.closest('[data-home]');
  if (h && (e.key === 'Enter' || e.key === ' ')){
    e.preventDefault();
    h.click();
  }
});
const mqEscritorio = window.matchMedia('(min-width:861px)');
mqEscritorio.addEventListener('change', e => { if (e.matches) closeDrawer(); });

/* ==================== CARGA DE CONTENIDO ==================== */
function loadCourse(id){
  const c = C.find(x => x.id === id);
  if (!c) return;

  cur = c.id;
  curId = c.id;

  // Barra superior
  $('#content-bar').hidden = false;
  $('#cur-title').textContent = c.t;

  // Botón completo
  const btn = $('#btn-complete');
  btn.textContent = isDone(c.id) ? 'Completo ✓' : 'Marcar como completo';
  btn.disabled = isDone(c.id);
  btn.classList.toggle('ghost', isDone(c.id));

  // Iframe
  const wrap = $('#frame-wrap');
  wrap.className = '';
  wrap.innerHTML = `<iframe class="content-frame" src="${c.url}" title="${c.t}" loading="lazy"></iframe>`;

  refreshSidebar();
}

/* Volver a la pantalla de inicio (sin curso abierto) */
const WELCOME_HTML = $('#frame-wrap').innerHTML;

function goHome(){
  cur = 'all';
  curId = null;
  openArea = null;

  $('#content-bar').hidden = true;
  $('#cur-title').textContent = '';

  const wrap = $('#frame-wrap');
  wrap.className = 'welcome';
  wrap.innerHTML = WELCOME_HTML;   // reemplaza el iframe del curso

  window.scrollTo(0, 0);
  refreshSidebar();
}

function refreshSidebar(){
  stats();
  syncNav();
}

/* ==================== EVENTOS ==================== */
document.addEventListener('click', e => {
  // Abrir / cerrar el índice (móvil y tablet)
  if (e.target.closest('#btn-menu')){ openDrawer(); return; }
  if (e.target.closest('#btn-close') || e.target.closest('#scrim')){ closeDrawer(true); return; }

  // Título "Capacitación Jurídica" o "Todos los cursos": volver al inicio
  if (e.target.closest('[data-home]') || e.target.closest('.nav-all')){
    goHome();
    closeDrawer();
    return;
  }

  // Acordeón
  const head = e.target.closest('[data-head]');
  if (head){
    const k = head.dataset.head;
    if (openArea === k){ openArea = null; cur = 'all'; }
    else { openArea = k; cur = k; }
    refreshSidebar();
    return;
  }

  // Chips / "Todos"
  const k = e.target.closest('[data-k]');
  if (k){
    cur = k.dataset.k;
    openArea = cur === 'all' ? null : cur;
    refreshSidebar();
    if (k.classList.contains('chip')) openDrawer();
    return;
  }

  // Curso (sub)
  const sub = e.target.closest('.sub');
  if (sub){
    loadCourse(sub.dataset.id);
    closeDrawer();
    return;
  }

  // Botón completo
  if (e.target.closest('#btn-complete')){
    if (!curId) return;
    P[curId] = true;
    save();
    // Actualizar botón
    const btn = $('#btn-complete');
    btn.textContent = 'Completo ✓';
    btn.disabled = true;
    btn.classList.add('ghost');
    refreshSidebar();
    return;
  }
});

/* ==================== INICIO ==================== */
buildNav();
buildChips();
refreshSidebar();
</script>
</body>
</html>
