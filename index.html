<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capacitación Jurídica · Defensoría Oficial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens ---------- */
:root{
  --bg:#F5F9FF;
  --surf:#FFFFFF;
  --ink:#0B2545;
  --mut:#4B6A99;
  --line:#B9D2F2;
  --accent:#1D4ED8;
  --soft:#EAF2FE;
  --on-accent:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08111F; --surf:#0E1B31; --ink:#DCE8FA; --mut:#8FAAD2;
    --line:#27436E; --accent:#7FA9F0; --soft:#132340; --on-accent:#08111F;
  }
}
:root[data-theme="dark"]{
  --bg:#08111F; --surf:#0E1B31; --ink:#DCE8FA; --mut:#8FAAD2;
  --line:#27436E; --accent:#7FA9F0; --soft:#132340; --on-accent:#08111F;
}

/* ---------- Base ---------- */
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 15.5px/1.65 "Plus Jakarta Sans",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
h1,h2,h3{font-family:"Bricolage Grotesque","Plus Jakarta Sans",sans-serif;
  font-weight:700;line-height:1.2;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:286px 1fr;min-height:100vh}
.side{
  position:sticky;top:0;height:100vh;overflow:auto;
  padding:22px 16px;background:var(--surf);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:6px;
}
main{padding:0;max-width:100%;width:100%;display:flex;flex-direction:column}

/* ---------- Marca ---------- */
.brand{display:flex;gap:10px;align-items:center;padding:0 6px 16px;margin-bottom:6px;
  border-bottom:1px solid var(--line)}
.logo{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--accent);
  color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:18px}
.brand b{font:700 15.5px/1.15 "Bricolage Grotesque",sans-serif;display:block}
.brand small{color:var(--mut);font-size:12px}

/* ---------- Navegación lateral ---------- */
.nav-all{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  border:1px solid transparent;border-radius:10px;padding:8px 10px;font-weight:600}
.nav-all span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-all em{font-style:normal;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.nav-all:hover{border-color:var(--line);background:var(--soft)}
.nav-all[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}

.acc{border:1px solid transparent;border-radius:10px;transition:border-color .18s,background .18s}
.acc.open{border-color:var(--line);background:var(--soft)}
.acc-head{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  border-radius:9px;padding:8px 10px;font-weight:600}
.acc-head i{font-style:normal;font-size:15px;color:var(--c)}
.acc-head span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-head em{font-style:normal;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.acc-head:hover{background:var(--soft)}
.caret{font-size:9px;line-height:1;color:var(--mut);transition:transform .2s}
.acc.open .caret{transform:rotate(90deg)}

.acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .24s ease}
.acc.open .acc-body{grid-template-rows:1fr}
.acc-inner{overflow:hidden}
.subs{margin:2px 8px 8px 20px;padding-left:10px;border-left:1px solid var(--line)}
.sub{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  font-size:13.5px;color:var(--mut);padding:5px 8px;border-radius:7px;line-height:1.35}
.sub span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub em{font-style:normal;font-size:11.5px;color:var(--accent);font-variant-numeric:tabular-nums}
.sub:hover{background:var(--surf);color:var(--ink)}
.sub.done span{color:var(--accent)}

/* ---------- Progreso lateral ---------- */
.me{margin-top:auto;padding:14px;border:1px solid var(--line);border-radius:12px;font-size:13px}
.me b{font:800 20px "Bricolage Grotesque",sans-serif}
.me small{display:block;color:var(--mut);font-size:12px;margin-top:6px}
.bar{height:6px;border-radius:99px;background:var(--soft);border:1px solid var(--line);overflow:hidden}
.bar u{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s}

/* ---------- Área de contenido ---------- */
.content-frame{
  flex:1;border:0;width:100%;min-height:calc(100vh - 80px);
  background:var(--surf);border-bottom:1px solid var(--line);
}
.content-bar{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:12px 24px;background:var(--surf);border-bottom:1px solid var(--line);
  flex-wrap:wrap;
}
.content-bar h2{font-size:18px;font-weight:700;margin:0}
.content-bar .actions{display:flex;gap:8px;align-items:center}
.btn{
  padding:8px 16px;font-weight:600;border-radius:9px;
  background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);
  transition:background .15s,color .15s;
}
.btn:hover{background:transparent;color:var(--accent)}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--accent)}
.btn.ghost:hover{background:var(--soft)}

/* ---------- Placeholder inicial ---------- */
.welcome{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:calc(100vh - 80px);padding:40px;text-align:center;color:var(--mut);
}
.welcome h2{font-size:26px;margin-bottom:12px;color:var(--ink)}
.welcome p{max-width:44ch;margin:0 auto}

/* ---------- Chips (móvil) ---------- */
.chips{display:none;gap:8px;overflow-x:auto;padding:14px 16px 2px;background:var(--surf);
  border-bottom:1px solid var(--line)}
.chip{flex:none;border:1px solid var(--line);background:var(--surf);border-radius:99px;
  padding:6px 14px;font-size:13.5px;color:var(--mut)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}

/* ---------- Responsive ---------- */
@media (max-width:860px){
  .app{display:block}
  .side{display:none}
  .chips{display:flex}
  .content-bar{padding:10px 16px}
}
</style>
</head>
<body>
<div class="app">

  <!-- ============ PANEL LATERAL ============ -->
  <aside class="side" aria-label="Índice de cursos">
    <div class="brand">
      <div class="logo">D</div>
      <div><b>Capacitación Jurídica</b><small>Defensoría Oficial 6</small></div>
    </div>

    <nav id="nav"></nav>

    <div class="me">
      <b id="mePct">0%</b> completado
      <div class="bar" style="margin-top:8px"><u id="meBar" style="width:0"></u></div>
      <small id="meTxt"></small>
    </div>
  </aside>

  <!-- ============ CONTENIDO PRINCIPAL ============ -->
  <main>
    <div class="chips" id="chips" role="group" aria-label="Áreas"></div>

    <div id="content-bar" class="content-bar" hidden>
      <h2 id="cur-title"></h2>
      <div class="actions">
        <button id="btn-complete" class="btn">Marcar como completo</button>
      </div>
    </div>

    <div id="frame-wrap" class="welcome">
      <h2>Seleccioná un curso</h2>
      <p>Elegí un tema en el panel lateral. El contenido se abrirá aquí, a pantalla completa.</p>
    </div>
  </main>
</div>

<script>
/* ==================== DATOS ==================== */
const A = {
  cap:['Capacidad y personas','#1E3A8A'],
  fam:['Familia','#1D4ED8'],
  nin:['Niñez y adolescencia','#0E7490'],
  pro:['Procesos en Misiones','#0369A1'],
  suc:['Sucesiones','#4338CA'],
  lab:['Derecho laboral','#6D28D9']
};

const C = [
  {id:'cap1', a:'cap', t:'Capacidad: principios generales', n:'CCyC, arts. 22 a 24', url:'https://fioravanteweb.github.io/capacitacion/capacidad1'},
  {id:'cap3', a:'cap', t:'Restricciones a la capacidad', n:'CCyC, arts. 31 a 50', url:'https://fioravanteweb.github.io/capacitacion/capacidad2'},
  {id:'rep', a:'cap', t:'Representación y asistencia', n:'CCyC, arts. 100 a 103', url:'https://fioravanteweb.github.io/capacitacion/capacidad3'},
  {id:'tut', a:'cap', t:'Tutela', n:'CCyC, arts. 104 a 137', url:'https://fioravanteweb.github.io/capacitacion/capacidad4'},
  {id:'rp', a:'fam', t:'Responsabilidad parental', n:'CCyC, arts. 638 a 704', url:'https://fioravanteweb.github.io/capacitacion/familia1'},
  {id:'div', a:'fam', t:'Disolución del matrimonio', n:'CCyC, arts. 435 a 445', url:'https://fioravanteweb.github.io/capacitacion/familia2'},
  {id:'ley16', a:'nin', t:'Protección integral de la niñez', n:'Ley II – N.º 16 (Misiones)', url:'https://fioravanteweb.github.io/capacitacion/nnya1'},
  {id:'ley52', a:'nin', t:'Defensor de los Derechos de Niños, Niñas y Adolescentes', n:'Ley IV – N.º 52 (Misiones)', url:'https://fioravanteweb.github.io/capacitacion/nnya2'},
  {id:'pj', a:'nin', t:'Régimen Penal Juvenil', n:'Ley 27.801', url:'https://fioravanteweb.github.io/capacitacion/penaljuvenil'},
  {id:'map', a:'pro', t:'Mapa del Código Procesal de Misiones', n:'Ley XII – N.º 27', url:'https://fioravanteweb.github.io/capacitacion/misiones1'},
  {id:'ali', a:'pro', t:'Juicio de alimentos', n:'Código Procesal, arts. 696 a 710', url:'https://fioravanteweb.github.io/capacitacion/misiones2'},
  {id:'dvm', a:'pro', t:'Juicio de divorcio', n:'Código Procesal, arts. 715 y 716', url:'https://fioravanteweb.github.io/capacitacion/misiones3'},
  {id:'vio', a:'pro', t:'Violencia familiar', n:'Ley XIV – N.º 6 y arts. 655 a 658', url:'https://fioravanteweb.github.io/capacitacion/misiones4'},
  {id:'des', a:'pro', t:'Juicio de desalojo', n:'Código Procesal, arts. 623 a 635', url:'https://fioravanteweb.github.io/capacitacion/misiones5'},
  {id:'succ', a:'suc', t:'El proceso sucesorio', n:'CCyC, arts. 2335 a 2362', url:'https://fioravanteweb.github.io/capacitacion/sucesion1'},
  {id:'sucm', a:'suc', t:'Proceso sucesorio en Misiones', n:'Código Procesal, arts. 717 a 763', url:'https://fioravanteweb.github.io/capacitacion/sucesion2'},
  {id:'lab', a:'lab', t:'Modernización Laboral', n:'Ley 27.802', url:'https://fioravanteweb.github.io/capacitacion/laboral1'}
];

/* ==================== ESTADO ==================== */
const $ = s => document.querySelector(s);
let P = {}, cur = null, openArea = null;
try { P = JSON.parse(localStorage.getItem('campus-jur') || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem('campus-jur', JSON.stringify(P)); } catch (e) {} };
const isDone = id => P[id] === true;

/* ==================== PROGRESO ==================== */
function stats(){
  const total = C.length;
  const hechas = C.filter(c => isDone(c.id)).length;
  const p = total ? Math.round(hechas / total * 100) : 0;
  $('#mePct').textContent = p + '%';
  $('#meBar').style.width = p + '%';
  $('#meTxt').textContent = hechas + ' de ' + total + ' cursos completos';
}

/* ==================== NAVEGACIÓN (ACORDEÓN) ==================== */
function buildNav(){
  let h = `<button class="nav-all" data-k="all" aria-pressed="true">
             <span>Todos los cursos</span><em>${C.length}</em>
           </button>`;

  for (const k in A){
    const [nombre, color] = A[k];
    const lista = C.filter(c => c.a === k).sort((a,b) => a.t.localeCompare(b.t,'es'));
    h += `<div class="acc" data-area="${k}">
            <button class="acc-head" data-head="${k}" aria-expanded="false" style="--c:${color}">
              <span>${nombre}</span><em>${lista.length}</em><b class="caret">▸</b>
            </button>
            <div class="acc-body"><div class="acc-inner"><div class="subs">
              ${lista.map(c => `<button class="sub" data-id="${c.id}">
                                  <span>${c.t}</span><em></em>
                                </button>`).join('')}
            </div></div></div>
          </div>`;
  }
  $('#nav').innerHTML = h;
}

function buildChips(){
  let h = `<button class="chip" data-k="all" aria-pressed="true">Todos</button>`;
  for (const k in A) h += `<button class="chip" data-k="${k}">${A[k][0]}</button>`;
  $('#chips').innerHTML = h;
}

function syncNav(){
  document.querySelectorAll('#nav .sub').forEach(b => {
    const c = C.find(x => x.id === b.dataset.id);
    const done = isDone(c.id);
    b.classList.toggle('done', done);
    b.querySelector('em').textContent = done ? 'Completo' : '';
  });
  $('.nav-all').setAttribute('aria-pressed', cur === 'all');
  document.querySelectorAll('.chip').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.k === cur));
  document.querySelectorAll('#nav .acc').forEach(a => {
    const on = a.dataset.area === openArea;
    a.classList.toggle('open', on);
    a.querySelector('.acc-head').setAttribute('aria-expanded', on);
  });
}

/* ==================== CARGA DE CONTENIDO ==================== */
function loadCourse(id){
  const c = C.find(x => x.id === id);
  if (!c) return;

  cur = c.id;

  // Barra superior
  $('#content-bar').hidden = false;
  $('#cur-title').textContent = c.t;

  // Botón completo
  const btn = $('#btn-complete');
  btn.textContent = isDone(c.id) ? 'Completo ✓' : 'Marcar como completo';
  btn.disabled = isDone(c.id);
  btn.classList.toggle('ghost', isDone(c.id));

  // Iframe
  const wrap = $('#frame-wrap');
  wrap.className = '';
  wrap.innerHTML = `<iframe class="content-frame" src="${c.url}" title="${c.t}" loading="lazy"></iframe>`;

  refreshSidebar();
}

function refreshSidebar(){
  stats();
  syncNav();
}

/* ==================== EVENTOS ==================== */
document.addEventListener('click', e => {
  // Acordeón
  const head = e.target.closest('[data-head]');
  if (head){
    const k = head.dataset.head;
    if (openArea === k){ openArea = null; cur = 'all'; }
    else { openArea = k; cur = k; }
    refreshSidebar();
    return;
  }

  // Chips / "Todos"
  const k = e.target.closest('[data-k]');
  if (k){
    cur = k.dataset.k;
    openArea = cur === 'all' ? null : cur;
    refreshSidebar();
    return;
  }

  // Curso (sub)
  const sub = e.target.closest('.sub');
  if (sub){
    loadCourse(sub.dataset.id);
    return;
  }

  // Botón completo
  if (e.target.closest('#btn-complete')){
    if (!cur) return;
    P[cur] = true;
    save();
    // Actualizar botón
    const btn = $('#btn-complete');
    btn.textContent = 'Completo ✓';
    btn.disabled = true;
    btn.classList.add('ghost');
    refreshSidebar();
    return;
  }
});

/* ==================== INICIO ==================== */
buildNav();
buildChips();
refreshSidebar();
</script>
</body>
</html>
